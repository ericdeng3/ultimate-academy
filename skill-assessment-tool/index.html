<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Assessment — Ultimate Academy 🥏</title>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PK7BFTYPJZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PK7BFTYPJZ');

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsPDF, loaded blocking (no async/defer) so it's guaranteed ready by the
       time the athlete taps "Download my report" — this tool has no other
       network calls, so a few hundred KB up front is an acceptable trade
       for never racing a lazy-load against a click. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#E05C2A',
            'brand-dark': '#C44E20',
            'brand-light': '#FFF0EA',
          },
        },
      },
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }

    /* Same step-transition pattern as apply/index.html's qualification flow */
    .qf-fade-out {
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .qf-fade-in {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .qf-fade-in-active { opacity: 1; transform: translateY(0); }

    .qf-input {
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .qf-input:focus {
      border-color: #E05C2A;
      box-shadow: 0 0 0 3px rgba(224,92,42,0.15);
    }
    .qf-select {
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .qf-select:focus {
      border-color: #D1D5DB;
    }

    /* Quiz answer buttons — same visual language as .qf-input (border-2,
       rounded-xl, bg-gray-50) but as large tappable rows instead of a
       native <select>, so a tap can both show a selected state AND
       auto-advance. A <select> can't do that cleanly. */
    .opt-btn {
      display: block;
      width: 100%;
      text-align: left;
      border: 2px solid #E5E7EB;
      background: #F9FAFB;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      font-size: 1.0625rem;
      font-weight: 500;
      color: #1F2937;
      transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
      min-height: 56px;
    }
    .opt-btn.selected {
      border-color: #E05C2A;
      background: #FFF0EA;
      color: #C44E20;
      font-weight: 700;
    }
    .opt-btn:disabled { cursor: default; }

    /* Multi-select variant, used by the embedded fit-check widget — same
       look, but with a checkbox indicator since more than one can be
       chosen and it doesn't auto-advance. */
    .opt-btn-multi {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      text-align: left;
      border: 2px solid #E5E7EB;
      background: #F9FAFB;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      font-size: 1.0625rem;
      font-weight: 500;
      color: #1F2937;
      transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
      min-height: 56px;
    }
    .opt-btn-multi.selected {
      border-color: #E05C2A;
      background: #FFF0EA;
      color: #C44E20;
      font-weight: 700;
    }
    .opt-check {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #D1D5DB;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .opt-btn-multi.selected .opt-check {
      border-color: #E05C2A;
      background: #E05C2A;
    }
    .opt-check svg { opacity: 0; width: 14px; height: 14px; }
    .opt-btn-multi.selected .opt-check svg { opacity: 1; }

    .progress-track { background: #F3F4F6; border-radius: 9999px; height: 6px; overflow: hidden; }
    .progress-fill { background: #E05C2A; height: 100%; transition: width 0.25s ease; }

    .cat-bar-track { background: #F3F4F6; border-radius: 9999px; height: 14px; overflow: hidden; }
    .cat-bar-fill { height: 100%; border-radius: 9999px; transition: width 0.4s ease; }
  </style>
</head>
<body class="bg-white text-gray-900 font-sans antialiased">

  <!-- ─── TOP BAR ──────────────────────────────────────────────────── -->
  <div class="sticky top-0 z-50 flex items-center justify-center py-4 px-4 bg-[#232321]">
    <a href="#" id="top-bar-restart" class="inline-flex items-center gap-2.5 bg-white rounded-lg px-5 py-2.5 hover:bg-gray-50 transition-colors">
      <span class="relative flex h-2.5 w-2.5 flex-shrink-0">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
      </span>
      <span class="text-xs sm:text-sm font-extrabold text-gray-900 uppercase tracking-wide">Start Your Free Skill Assessment</span>
    </a>
  </div>

  <main class="px-4 sm:px-6 py-8 sm:py-12">
    <div id="app" class="max-w-xl mx-auto"></div>
  </main>

  <!-- ─── FOOTER ──────────────────────────────────────────────────── -->
  <footer class="py-8 px-6 border-t border-gray-100 mt-6">
    <div class="max-w-5xl mx-auto flex items-center justify-center">
      <p class="text-xs text-gray-400">© 2026 Eric Deng Ultimate. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // ════════════════════════════════════════════════════════════════
    // ALL content lives here — wording, options, points, categories,
    // thresholds. Edit this object to change the quiz; the code below it
    // never needs to change for a copy/content edit.
    // ════════════════════════════════════════════════════════════════
    const ASSESSMENT = {

      intro: {
        heading: 'Identify your biggest gaps in ultimate, and get a custom report to fix it in 5 minutes.',
        sub: "Answer a few questions about your goals, your training and your game. Get a personalised report in 5 minutes for free. No sign-up required.",
        button: 'START THE ASSESSMENT →',
      },

      nameScreen: {
        heading: "Last step – what's your first name?",
        sub: "We'll put it on your report.",
        button: 'SEE MY RESULTS',
      },

      categories: {
        // 36, not 32 — TA1 (is your strength training an actual
        // ultimate-specific program, or ad-hoc?) counts here too, on top of
        // Structure. Without it, raw session frequency alone could max out
        // Athleticism even with zero real programming behind it.
        athleticism: { label: 'Athleticism', group: 'game', max: 36 },
        skill:       { label: 'Skill development', group: 'game', max: 24 },
        gameiq:      { label: 'Game IQ', group: 'game', max: 20 },
        structure:   { label: 'Structure', group: 'training', max: 16 },
        feedback:    { label: 'Feedback & accountability', group: 'training', max: 12 },
      },

      // Priority order used when category scores tie for "top gap" — first
      // in this list wins the tie (gets flagged as the gap first).
      tieBreakOrder: ['structure', 'feedback', 'gameiq', 'skill', 'athleticism'],

      gapCopy: {
        athleticism: {
          whatItLooksLike: "Your body limits your game: slow first steps, hesitant cuts off one leg, or legs gone by the last game.",
          howToCloseIt: "A structured, ultimate-specific strength and speed plan that progresses through the season, plus feedback on your movement.",
        },
        skill: {
          whatItLooksLike: "Your skills work in drills but break down at game speed, under a mark or against a good defender.",
          howToCloseIt: "Regular skill sessions in your plan, plus feedback on specific skills like your throws, cutting footwork or defensive positioning.",
        },
        gameiq: {
          whatItLooksLike: "You play reactively. The same situations keep coming up, but you're deciding late or guessing.",
          howToCloseIt: "Feedback on your gameplay, so you learn the patterns that decide games and train them into your skill set.",
        },
        structure: {
          whatItLooksLike: "You train, but without an ultimate-specific plan that fits your life and builds through the year.",
          howToCloseIt: "A plan built around your schedule that changes through the year and peaks you for tryouts and tournaments.",
        },
        feedback: {
          whatItLooksLike: "Nobody is telling you what to fix, so your training doesn't turn into impact on the field.",
          howToCloseIt: "Regular feedback on specific parts of your game, a clear plan from it, and someone keeping you on track.",
        },
      },

      scale5: [
        { label: 'Strongly disagree', value: 0 },
        { label: 'Disagree', value: 1 },
        { label: 'Neither agree nor disagree', value: 2 },
        { label: 'Agree', value: 3 },
        { label: 'Strongly agree', value: 4 },
      ],

      // ── Part 1: Goal (unscored) ──────────────────────────────────
      part1: [
        {
          id: 'P1', part: 1, partLabel: 'Goal', type: 'text', required: true, maxLength: 80,
          text: "What's the main goal you're working towards in the next 3–12 months?",
          placeholder: 'e.g. Make a Div 1 club team',
        },
        {
          id: 'P2', part: 1, partLabel: 'Goal', type: 'scale10', required: true,
          text: 'How important is this goal to you?',
        },
        {
          id: 'P3', part: 1, partLabel: 'Goal', type: 'choice', required: true,
          text: 'When would you like to have achieved this goal by?',
          options: [
            { label: 'Within 3 months', value: 'lt3' },
            { label: '3–6 months', value: '3to6' },
            { label: '6–12 months', value: '6to12' },
            { label: 'No set date', value: 'none' },
          ],
        },
        {
          id: 'P4', part: 1, partLabel: 'Goal', type: 'choice', required: true,
          text: "What's your main role?",
          options: [
            { label: 'Handler', value: 'handler' },
            { label: 'Cutter', value: 'cutter' },
            { label: 'Hybrid', value: 'hybrid' },
          ],
        },
        {
          id: 'P5', part: 1, partLabel: 'Goal', type: 'choice', required: true,
          text: 'What best describes where you usually play ultimate?',
          options: [
            { label: 'Pick ups', value: 'pickups' },
            { label: 'Leagues', value: 'leagues' },
            { label: 'Club trainings/tournaments', value: 'club' },
            { label: 'A mix', value: 'mix' },
          ],
        },
      ],

      // ── Part 2: Training audit (scored) ──────────────────────────
      // metIndexes = which option index(es) count as "meeting the standard"
      part2: [
        {
          // Unscored and not itself a "standard" (no standardLabel, so
          // computeStandards() skips it) — exists purely to personalise the
          // TA4/TA6 standards below to how much the athlete already plays.
          id: 'PF', part: 2, partLabel: 'Training audit', type: 'choice',
          text: 'How many times per week do you currently play ultimate (games, training or league)?',
          options: [
            { label: '0', value: 0 },
            { label: '1', value: 1 },
            { label: '2', value: 2 },
            { label: '3+', value: 3 },
          ],
        },
        {
          id: 'TA1', part: 2, partLabel: 'Training audit', type: 'choice', category: 'structure',
          text: 'Which best describes your strength training?',
          standardLabel: 'Ultimate-specific strength program', metIndexes: [3],
          options: [
            { label: 'None', value: 0 },
            { label: 'Workouts I make up on the day', value: 1 },
            { label: 'A general gym program', value: 2 },
            { label: 'An ultimate-specific program', value: 4 },
          ],
        },
        {
          id: 'TA2', part: 2, partLabel: 'Training audit', type: 'choice', category: 'athleticism',
          text: 'How many strength sessions do you do per week?',
          standardLabel: '2+ strength sessions a week', metIndexes: [2, 3],
          options: [
            { label: '0', value: 0 },
            { label: '1', value: 2 },
            { label: '2', value: 4 },
            { label: '3+', value: 4 },
          ],
        },
        {
          id: 'TA3', part: 2, partLabel: 'Training audit', type: 'choice', category: 'structure',
          text: 'How does your strength training change week to week?',
          standardLabel: 'Planned progression', metIndexes: [3],
          options: [
            { label: "I don't strength train", value: 0 },
            { label: 'It stays the same', value: 1 },
            { label: 'I add weight when it feels easy', value: 2 },
            { label: 'It follows a planned progression', value: 4 },
          ],
        },
        {
          id: 'TA4', part: 2, partLabel: 'Training audit', type: 'choice', category: 'athleticism',
          text: 'How often do you train your high-speed running (sprinting at 90%+ of your max)?',
          standardLabel: 'High-speed running 2x a week', metIndexes: [3],
          // Personalised to playing load: low-frequency players need 2x/week
          // of dedicated top-speed work, higher-frequency players need 1x —
          // but never 0, since pure top-speed sprinting rarely happens
          // during ultimate itself, no matter how much you play.
          dynamicLabel: playFreq => {
            const target = computeTopSpeedTarget(playFreq);
            return 'High-speed running, ' + target + 'x a week for your playing load';
          },
          dynamicMinMetIndex: playFreq => (computeTopSpeedTarget(playFreq) <= 1 ? 2 : 3),
          options: [
            { label: 'Rarely or never', value: 0 },
            { label: 'Only at games or team training', value: 1 },
            { label: 'Once a week', value: 2 },
            { label: 'Twice a week or more', value: 4 },
          ],
        },
        {
          id: 'TA5', part: 2, partLabel: 'Training audit', type: 'choice', category: 'athleticism',
          text: 'How often do you do repeat-sprint conditioning, like shuttles or MAS running?',
          standardLabel: 'Repeat-sprint conditioning 1-2x a week', metIndexes: [2, 3],
          options: [
            { label: 'Rarely or never', value: 0 },
            { label: 'Once a fortnight', value: 1 },
            { label: 'Once a week', value: 2 },
            { label: 'Twice a week or more', value: 4 },
          ],
        },
        {
          id: 'TA6', part: 2, partLabel: 'Training audit', type: 'choice', category: 'athleticism',
          text: 'How often do you train ultimate-specific acceleration and change of direction?',
          standardLabel: 'Acceleration & change of direction 2x a week', metIndexes: [3],
          // Personalised: target = enough accel/COD work that (playing +
          // accel/COD) sessions add up to 3 a week. Unlike top-speed work,
          // this CAN drop to 0 extra sessions needed at high playing
          // frequency, since games themselves provide real COD stimulus.
          dynamicLabel: playFreq => {
            const target = computeAccelCodTarget(playFreq);
            return target <= 0
              ? 'Acceleration & change of direction (covered by your playing load)'
              : 'Acceleration & change of direction, ' + target + 'x a week for your playing load';
          },
          dynamicMinMetIndex: playFreq => {
            const target = computeAccelCodTarget(playFreq);
            return target <= 0 ? -1 : target === 1 ? 2 : 3;
          },
          options: [
            { label: 'Rarely or never', value: 0 },
            { label: 'Once a fortnight', value: 1 },
            { label: 'Once a week', value: 2 },
            { label: 'Twice a week or more', value: 4 },
          ],
        },
        {
          // Split into two questions (frequency + structure) rather than one
          // combined question — same underlying signal as before (doing it
          // regularly AND with real structure is what counts as fully
          // "met"), but asked as two separate, simpler questions. TA7Structure
          // is unscored (no standardLabel/category) — it only gates TA7's
          // tier, the same role PF plays for TA4/TA6.
          id: 'TA7', part: 2, partLabel: 'Training audit', type: 'choice', category: 'skill',
          text: 'How often do you work on your throws outside of team training?',
          standardLabel: 'Structured throwing practice, weekly',
          dynamicTier: answers => computeStructuredPracticeTier(answers['TA7'], answers['TA7Structure']),
          dynamicUserLabel: answers => combineFreqStructureLabel(answers['TA7'], answers['TA7Structure']),
          options: [
            { label: 'Rarely or never', value: 0 },
            { label: 'Once a fortnight', value: 1 },
            { label: 'Once a week', value: 2 },
            { label: 'Twice a week or more', value: 4 },
          ],
        },
        {
          id: 'TA7Structure', part: 2, partLabel: 'Training audit', type: 'choice',
          text: 'How structured is your throwing training?',
          options: [
            { label: 'Self-directed — I come up with it myself', value: 0 },
            { label: 'Structured — specific drills or a coached plan', value: 1 },
          ],
        },
        {
          id: 'TA8', part: 2, partLabel: 'Training audit', type: 'choice', category: 'skill',
          text: 'How often do you work on cutting or defensive footwork outside team training?',
          standardLabel: 'Structured footwork training, weekly',
          dynamicTier: answers => computeStructuredPracticeTier(answers['TA8'], answers['TA8Structure']),
          dynamicUserLabel: answers => combineFreqStructureLabel(answers['TA8'], answers['TA8Structure']),
          options: [
            { label: 'Rarely or never', value: 0 },
            { label: 'Once a fortnight', value: 1 },
            { label: 'Once a week', value: 2 },
            { label: 'Twice a week or more', value: 4 },
          ],
        },
        {
          id: 'TA8Structure', part: 2, partLabel: 'Training audit', type: 'choice',
          text: 'How structured is your cutting/footwork training?',
          options: [
            { label: 'Self-directed — I come up with it myself', value: 0 },
            { label: 'Structured — specific drills or a coached plan', value: 1 },
          ],
        },
        {
          id: 'TA9', part: 2, partLabel: 'Training audit', type: 'choice', category: 'gameiq',
          text: 'How often do you review footage of your own skills or gameplay?',
          standardLabel: 'Regular footage review', metIndexes: [3],
          options: [
            { label: 'Rarely or never', value: 0 },
            { label: 'A few times a season', value: 1 },
            { label: 'Monthly', value: 2 },
            { label: 'Every 1-2 weeks', value: 4 },
          ],
        },
        {
          id: 'TA10', part: 2, partLabel: 'Training audit', type: 'choice', category: 'feedback',
          text: 'How often do you get expert feedback on your skills and movement?',
          standardLabel: 'Regular expert feedback', metIndexes: [3],
          options: [
            { label: 'Rarely or never', value: 0 },
            { label: 'A few times a season', value: 1 },
            { label: 'Monthly', value: 2 },
            { label: 'Every 1-2 weeks', value: 4 },
          ],
        },
        {
          // Still asked and still scored (feeds the Feedback & accountability
          // category) but no longer its own checklist row — it was
          // redundant next to TA10's "Regular expert feedback" standard.
          id: 'TA11', part: 2, partLabel: 'Training audit', type: 'choice', category: 'feedback',
          text: 'When you get feedback, what do you leave with?',
          options: [
            { label: "I don't get feedback", value: 0 },
            { label: 'General tips', value: 1 },
            { label: 'A rough idea of what to work on', value: 2 },
            { label: 'A structured plan with clear steps to improve', value: 4 },
          ],
        },
        {
          // Reframed from "do you complete your planned sessions" (a weak
          // signal — completing sessions means nothing if they were never
          // structured in the first place) to "do you actually have a
          // structured plan at all".
          id: 'TA12', part: 2, partLabel: 'Training audit', type: 'choice', category: 'structure',
          text: 'Which best describes how your week of training is organised?',
          standardLabel: 'Following a structured, ultimate-specific plan', metIndexes: [3],
          options: [
            { label: "I don't have a plan — I train based on how I feel", value: 0 },
            { label: "I have a rough idea, but it's not written down", value: 1 },
            { label: 'I follow a general plan, but not specific to ultimate', value: 2 },
            { label: 'I follow a structured, ultimate-specific plan', value: 4 },
          ],
        },
        {
          id: 'TA13', part: 2, partLabel: 'Training audit', type: 'choice', category: 'structure',
          text: 'Does your training plan change with your needs during the calendar year?',
          standardLabel: 'Training that progresses with you through the year', metIndexes: [2],
          options: [
            { label: "No, don't have that planned", value: 0 },
            { label: 'Somewhat, but not planned', value: 2 },
            { label: 'Yes, planned around my calendar', value: 4 },
          ],
        },
      ],

      // ── Part 3: Your game (scored, shuffled once per session) ─────
      part3: [
        { id: 'YG1', part: 3, partLabel: 'Your game', type: 'scale5', category: 'athleticism', text: "I'm explosive over my first 3 to 5 steps." },
        { id: 'YG2', part: 3, partLabel: 'Your game', type: 'scale5', category: 'athleticism', text: 'I change direction hard off either leg with full confidence.' },
        { id: 'YG3', part: 3, partLabel: 'Your game', type: 'scale5', category: 'athleticism', text: 'On a long point, my third or fourth hard cut is still close to full speed.' },
        { id: 'YG4', part: 3, partLabel: 'Your game', type: 'scale5', category: 'athleticism', text: 'My legs hold up in the last game of a tournament day.' },
        { id: 'YG5', part: 3, partLabel: 'Your game', type: 'scale5', category: 'skill', text: 'I can hit an inside or around break against a mark in games, not just in warm-ups.' },
        { id: 'YG6', part: 3, partLabel: 'Your game', type: 'scale5', category: 'skill', text: 'My hucks land where I intend, with a catchable flight.' },
        { id: 'YG7', part: 3, partLabel: 'Your game', type: 'scale5', category: 'skill', text: 'My footwork gets me separation without relying on raw speed.' },
        { id: 'YG8', part: 3, partLabel: 'Your game', type: 'scale5', category: 'skill', text: 'On defence, my positioning lets me stay with my player while seeing the disc.' },
        { id: 'YG9', part: 3, partLabel: 'Your game', type: 'scale5', category: 'gameiq', text: 'I recognise the patterns that keep coming up in games, like a defender fronting me, and know how to beat them.' },
        { id: 'YG10', part: 3, partLabel: 'Your game', type: 'scale5', category: 'gameiq', text: "I'm able to create separation from my defender, and I often get thrown to because of it." },
        { id: 'YG11', part: 3, partLabel: 'Your game', type: 'scale5', category: 'gameiq', text: 'I know where to create block chances on the field, and I use my game IQ to reposition rather than just staying close.' },
        { id: 'YG12', part: 3, partLabel: 'Your game', type: 'scale5', category: 'gameiq', text: "Before each point, I know my job and what our line is trying to do." },
        { id: 'YG13', part: 3, partLabel: 'Your game', type: 'scale5', category: 'feedback', text: 'I can see my training gains showing up in how I play in games.' },
      ],
    };

    // Category → the question ids whose points count toward it.
    // TA1 deliberately appears in both athleticism and structure — see the
    // comment on ASSESSMENT.categories.athleticism above.
    const CATEGORY_ITEMS = {
      athleticism: ['TA1', 'TA2', 'TA4', 'TA5', 'TA6', 'YG1', 'YG2', 'YG3', 'YG4'],
      skill:       ['TA7', 'TA8', 'YG5', 'YG6', 'YG7', 'YG8'],
      gameiq:      ['TA9', 'YG9', 'YG10', 'YG11', 'YG12'],
      structure:   ['TA1', 'TA3', 'TA12', 'TA13'],
      feedback:    ['TA10', 'TA11', 'YG13'],
    };

    // ════════════════════════════════════════════════════════════════
    // Scoring engine — pure functions of an `answers` map, so the same
    // code powers the on-screen results and the self-tests below.
    // answers[id] = { index, value, label } (index/value omitted for P1's
    // free text; value is the raw text for P1, the 1–10 number for P2).
    // ════════════════════════════════════════════════════════════════

    function computeCategoryScores(answers) {
      const scores = {};
      for (const cat in CATEGORY_ITEMS) {
        const items = CATEGORY_ITEMS[cat];
        const sum = items.reduce((s, id) => s + (answers[id] ? answers[id].value : 0), 0);
        scores[cat] = Math.round((sum / ASSESSMENT.categories[cat].max) * 100);
      }
      // Hard cap, not just a point discount: without an actual
      // ultimate-specific strength program (TA1's top answer), Athleticism
      // caps at the top of "Developing" (69) — NOT "Solid" (70-84). Session
      // frequency alone, with no real program behind it, is a real gap, not
      // a near-miss — it shouldn't read as a positive/green rating.
      const ta1 = answers['TA1'];
      if (!ta1 || ta1.index < 3) {
        scores.athleticism = Math.min(scores.athleticism, 69);
      }
      return scores;
    }

    function computeOverall(categoryScores) {
      const vals = Object.values(categoryScores);
      return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
    }

    // playFreq (0,1,2,3="3+") → how many dedicated top-speed sessions/week
    // are the target. Floors at 1 — pure top-speed sprinting rarely happens
    // during ultimate itself, so it's never fully replaced by playing more.
    function computeTopSpeedTarget(playFreq) {
      return playFreq <= 1 ? 2 : 1;
    }

    // playFreq → how many dedicated acceleration/COD sessions/week are the
    // target, so that (playing + accel/COD) adds up to 3 sessions. Floors
    // at 0 — games themselves provide real COD stimulus, so a high playing
    // load can cover this entirely.
    function computeAccelCodTarget(playFreq) {
      return Math.max(0, 3 - playFreq);
    }

    // index/minMetIndex → 'green' (met) / 'yellow' (one step below the
    // standard — a decent starting point, not a priority) / 'red' (two or
    // more steps below). minMetIndex < 0 means "always met" (e.g. accel/COD
    // fully covered by playing load).
    function tierFromIndex(index, minMetIndex) {
      if (minMetIndex < 0 || index >= minMetIndex) return 'green';
      if (index === minMetIndex - 1) return 'yellow';
      return 'red';
    }

    // Two-axis version of the same idea, for TA7/TA8 (throwing/footwork
    // practice), which got split into a frequency question and a separate
    // structure question: green needs BOTH weekly+ frequency AND real
    // structure; either one alone is a yellow starting point; neither is red.
    function computeStructuredPracticeTier(freqAns, structureAns) {
      if (!freqAns || !structureAns) return 'red';
      const structured = structureAns.index === 1;
      const weeklyPlus = freqAns.index >= 2;
      if (structured && weeklyPlus) return 'green';
      if (structured || weeklyPlus) return 'yellow';
      return 'red';
    }

    function combineFreqStructureLabel(freqAns, structureAns) {
      if (!freqAns || !structureAns) return '—';
      return freqAns.label + ' · ' + structureAns.label;
    }

    function computeStandards(answers) {
      const playFreq = answers['PF'] ? answers['PF'].value : 0;
      return ASSESSMENT.part2
        .filter(q => q.standardLabel) // PF, TA7Structure, TA8Structure aren't standards of their own
        .map(q => {
          const ans = answers[q.id];
          let tier;
          if (q.dynamicTier) {
            tier = q.dynamicTier(answers);
          } else {
            const minMetIndex = q.dynamicMinMetIndex ? q.dynamicMinMetIndex(playFreq) : Math.min.apply(null, q.metIndexes);
            tier = ans ? tierFromIndex(ans.index, minMetIndex) : 'red';
          }
          const label = q.dynamicLabel ? q.dynamicLabel(playFreq) : q.standardLabel;
          const userLabel = q.dynamicUserLabel ? q.dynamicUserLabel(answers) : (ans ? ans.label : '—');
          return { id: q.id, label: label, tier: tier, met: tier === 'green', userLabel: userLabel };
        });
    }

    // Short plain-language summary of the standards checklist, for the
    // block between the checklist and "How to close your gaps" — distinct
    // from the category-level "Your Top 3 Gaps" above it, this one calls
    // out specific training behaviors rather than broad categories.
    function computeStandardsSummary(standards) {
      const red = standards.filter(s => s.tier === 'red').map(s => s.label);
      const yellow = standards.filter(s => s.tier === 'yellow').map(s => s.label);
      if (red.length > 0) {
        return 'Right now, your biggest gaps are: ' + red.join('; ') + '. Fixing these first will move the needle fastest.';
      }
      if (yellow.length > 0) {
        return "You've got the fundamentals in place — these are still just developing: " + yellow.join('; ') + '. Tightening these up is what gets you the rest of the way.';
      }
      return "You're meeting every training standard we track. From here, your biggest gains come from feedback and game-specific coaching, not more training volume.";
    }

    function computeSessionEstimate(answers) {
      const ta2 = answers['TA2'];
      let total = ta2 ? ta2.index : 0; // 0,1,2,3 directly represents "0,1,2,3+" sessions
      ['TA4', 'TA5', 'TA6', 'TA7', 'TA8'].forEach(id => {
        const a = answers[id];
        if (!a) return;
        if (a.index === 2) total += 1;
        else if (a.index === 3) total += 2;
      });
      return total;
    }

    // Shared between the on-page checklist and the PDF checklist.
    const TIER_ICON = { green: '✓', yellow: '●', red: '✗' };
    const TIER_LABEL = { green: 'Met', yellow: 'Developing', red: 'Not yet' };
    const TIER_COLOR = { green: '#16A34A', yellow: '#D97706', red: '#DC2626' };

    function bandFor(score) {
      if (score >= 85) return { key: 'strength', label: 'Strength', color: '#16A34A' };
      if (score >= 70) return { key: 'solid', label: 'Solid', color: '#0D9488' };
      if (score >= 50) return { key: 'developing', label: 'Developing', color: '#D97706' };
      return { key: 'priority', label: 'Priority gap', color: '#DC2626' };
    }

    function computeFlag(categoryScores, answers, sessionEstimate) {
      if (categoryScores.athleticism >= 70 && (categoryScores.skill < 55 || categoryScores.gameiq < 55)) {
        return { key: 'fitNotShowing', message: "Your physical base is ahead of your game. The gains aren't reaching the field yet." };
      }
      const yg13 = answers['YG13'];
      if (yg13 && yg13.index <= 1 && sessionEstimate >= 4) {
        return { key: 'workingHard', message: "You're putting in the work, but you can't feel it in games. That points to missing structure and feedback, not missing effort." };
      }
      return null;
    }

    function computeTopGaps(categoryScores, answers) {
      const order = ASSESSMENT.tieBreakOrder;
      const items = Object.keys(categoryScores).map(key => ({
        key: key,
        score: categoryScores[key],
        tie: order.indexOf(key),
      }));
      items.sort((a, b) => a.score - b.score || a.tie - b.tie);
      const gaps = items.slice(0, 3).map(i => Object.assign(
        { key: i.key, score: i.score, label: ASSESSMENT.categories[i.key].label, band: bandFor(i.score) },
        ASSESSMENT.gapCopy[i.key]
      ));

      // Force an ultimate-specific strength program to the #1 gap whenever
      // it's the reason Athleticism is capped (see computeCategoryScores).
      // That's the core thing the program offers, so it should never get
      // buried behind an aggregate Athleticism score the cap itself is
      // already flagging as not fully trustworthy — a merely-okay score
      // from session frequency alone shouldn't push this out of the top 3.
      const ta1 = answers ? answers['TA1'] : null;
      if (!ta1 || ta1.index < 3) {
        const athleticismGap = {
          key: 'athleticism',
          score: categoryScores.athleticism,
          label: ASSESSMENT.categories.athleticism.label,
          band: bandFor(categoryScores.athleticism),
          whatItLooksLike: "You're putting in real time, but without an ultimate-specific strength and conditioning program behind it, that time isn't converting into the explosiveness, speed and durability that show up on the field.",
          howToCloseIt: "A structured, ultimate-specific strength and conditioning program — not generic gym workouts — built around the movements and demands of ultimate.",
        };
        return [athleticismGap].concat(gaps.filter(g => g.key !== 'athleticism')).slice(0, 3);
      }

      return gaps;
    }

    // Bracket thresholds are tuned for the CURRENT standards total (12, see
    // computeStandards — TA1-TA13 minus TA11, which was folded into TA10).
    // If the standards checklist grows or shrinks again, re-tune these.
    function computeGoalHeadline(answers, standardsMetCount, totalStandards) {
      const p1 = answers['P1'] ? answers['P1'].value : '';
      const p2 = answers['P2'] ? answers['P2'].value : '';
      const p3 = answers['P3'];
      let line;
      if (standardsMetCount <= 4) {
        line = "Your training isn't set up for this goal yet. The gaps below are why it feels further away than it should.";
      } else if (standardsMetCount <= 7) {
        line = "You're doing some things right, but the gaps below are holding back your progress.";
      } else if (standardsMetCount <= 10) {
        line = "Your base is solid. Closing the last few gaps is what separates you from the next level.";
      } else {
        line = "Your training is close to the standard. Your biggest gains now come from feedback on your game.";
      }
      let extra = null;
      if (p3 && p3.value === 'lt3' && standardsMetCount <= 7) {
        extra = "With under 3 months to go, which gaps you close first matters.";
      }
      return { goal: p1, importance: p2, standardsMetCount: standardsMetCount, totalStandards: totalStandards, line: line, extra: extra };
    }

    function computeResults(answers) {
      const categoryScores = computeCategoryScores(answers);
      const overall = computeOverall(categoryScores);
      const standards = computeStandards(answers);
      const standardsMetCount = standards.filter(s => s.met).length;
      const standardsSummary = computeStandardsSummary(standards);
      const sessionEstimate = computeSessionEstimate(answers);
      const flag = computeFlag(categoryScores, answers, sessionEstimate);
      const topGaps = computeTopGaps(categoryScores, answers);
      const goalHeadline = computeGoalHeadline(answers, standardsMetCount, standards.length);
      return { categoryScores, overall, standards, standardsMetCount, standardsSummary, sessionEstimate, flag, topGaps, goalHeadline };
    }

    // ════════════════════════════════════════════════════════════════
    // Quiz flow / rendering
    // ════════════════════════════════════════════════════════════════

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    let allQuestions = [];
    let state = {};

    function resetState() {
      allQuestions = ASSESSMENT.part1.concat(ASSESSMENT.part2, shuffle(ASSESSMENT.part3));
      state = { screen: 'intro', qIndex: 0, answers: {}, name: '' };
    }
    resetState();

    const app = document.getElementById('app');

    // onReady fires AFTER the new HTML is actually in the DOM — the fade-out
    // path delays that swap by 160ms, so event wiring must happen inside
    // this callback rather than right after calling transitionTo(), or it
    // attaches listeners to the screen that's on its way out.
    function transitionTo(html, onReady) {
      const current = app.firstElementChild;
      if (!current) {
        app.innerHTML = html;
        if (onReady) onReady();
        return;
      }
      current.classList.add('qf-fade-out');
      setTimeout(() => {
        app.innerHTML = html;
        const next = app.firstElementChild;
        if (next) {
          next.classList.add('qf-fade-in');
          requestAnimationFrame(() => next.classList.add('qf-fade-in-active'));
          setTimeout(() => next.classList.remove('qf-fade-in', 'qf-fade-in-active'), 220);
        }
        if (onReady) onReady();
      }, 160);
    }

    function cardWrap(innerHtml) {
      return '<div class="bg-white rounded-3xl shadow-lg border border-gray-100 p-6 md:p-8">' + innerHtml + '</div>';
    }

    function progressHtml(stepNumber) {
      // Total steps = every question + the name screen. Derived from
      // allQuestions.length rather than hardcoded, so adding/removing a
      // question (like PF below) never silently breaks the progress bar.
      const totalSteps = allQuestions.length + 1;
      const pct = Math.round((stepNumber / totalSteps) * 100);
      return '' +
        '<div class="flex justify-end mb-1.5"><span class="text-xs font-semibold text-gray-400">' + pct + '% complete</span></div>' +
        '<div class="progress-track mb-5"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    }

    function partDotsHtml(currentPart) {
      const parts = [
        { n: 1, label: 'Goal' },
        { n: 2, label: 'Training audit' },
        { n: 3, label: 'Your game' },
      ];
      return '<div class="flex items-center justify-center gap-3 mb-6 pb-5 border-b border-gray-100 text-xs sm:text-sm">' +
        parts.map((p, i) => {
          const active = p.n === currentPart;
          const done = p.n < currentPart;
          const cls = active ? 'font-bold text-brand' : done ? 'font-medium text-gray-400' : 'font-medium text-gray-300';
          const dotCls = active ? 'bg-brand' : done ? 'bg-gray-300' : 'bg-gray-200';
          return '<span class="flex items-center gap-1.5 ' + cls + '"><span class="w-2 h-2 rounded-full ' + dotCls + '"></span>' + p.label + '</span>' +
            (i < parts.length - 1 ? '<span class="text-gray-300">·</span>' : '');
        }).join('') +
        '</div>';
    }

    function backButtonHtml(enabled) {
      if (!enabled) return '';
      return '<button type="button" id="back-btn" class="text-sm font-semibold text-gray-400 hover:text-gray-600 transition-colors mb-4">← Back</button>';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function render() {
      if (state.screen === 'intro') return renderIntro();
      if (state.screen === 'question') return renderQuestion();
      if (state.screen === 'name') return renderName();
      if (state.screen === 'results') return renderResults();
    }

    function renderIntro() {
      const html = cardWrap(
        '<div class="text-center">' +
        '<h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 leading-tight mb-3">' + escapeHtml(ASSESSMENT.intro.heading) + '</h1>' +
        '<p class="text-base text-gray-500 leading-relaxed mb-5">' + escapeHtml(ASSESSMENT.intro.sub) + '</p>' +
        '<div class="rounded-2xl overflow-hidden shadow-sm mb-5">' +
        '<img src="NSU%20summer%20league%20finals%20199.jpg" alt="NSU Summer League Finals" class="w-full h-56 object-cover" />' +
        '</div>' +
        '<button type="button" id="start-btn" class="w-full bg-brand text-white font-extrabold px-8 py-5 rounded-xl border-2 border-brand hover:bg-white hover:text-brand transition-colors shadow-sm text-lg">' + ASSESSMENT.intro.button + '</button>' +
        '</div>'
      );
      transitionTo(html, () => {
        document.getElementById('start-btn').addEventListener('click', () => {
          state.screen = 'question';
          state.qIndex = 0;
          render();
        });
      });
    }

    function renderQuestion() {
      const q = allQuestions[state.qIndex];
      const stepNumber = state.qIndex + 1; // 1-indexed, out of 32
      const saved = state.answers[q.id];

      let bodyHtml = '';
      if (q.type === 'text') {
        bodyHtml =
          '<form id="q-form">' +
          '<input type="text" id="q-text-input" maxlength="' + q.maxLength + '" placeholder="' + escapeHtml(q.placeholder || '') + '" value="' + escapeHtml(saved ? saved.value : '') + '" class="qf-input w-full border-2 border-gray-200 rounded-xl px-5 py-4 text-lg font-medium text-gray-800 placeholder-gray-400 bg-gray-50 transition mb-4" />' +
          '<button type="submit" id="q-next-btn" class="w-full bg-brand text-white font-bold py-4 rounded-xl hover:bg-brand-dark transition-colors text-lg shadow-sm disabled:opacity-40 disabled:cursor-not-allowed" ' + (saved && saved.value ? '' : 'disabled') + '>Next →</button>' +
          '</form>';
      } else if (q.type === 'scale10') {
        const val = (saved && saved.value) || 5;
        bodyHtml =
          '<div class="text-center mb-4"><span id="scale-value" class="text-5xl font-extrabold text-brand">' + val + '</span></div>' +
          '<input type="range" id="scale-slider" min="1" max="10" step="1" value="' + val + '" class="w-full" style="accent-color:#E05C2A; height: 8px;" />' +
          '<div class="flex justify-between text-xs text-gray-400 mt-2 px-1"><span>Not important</span><span>Critical</span></div>' +
          '<button type="button" id="scale-next-btn" class="w-full bg-brand text-white font-bold py-4 rounded-xl hover:bg-brand-dark transition-colors text-lg shadow-sm mt-6">Next →</button>';
      } else if (q.type === 'scale5') {
        const idx = (saved && typeof saved.index === 'number') ? saved.index : 2;
        const opt = ASSESSMENT.scale5[idx];
        bodyHtml =
          '<p class="text-sm text-gray-400 mb-3">How much do you agree with this statement?</p>' +
          '<div class="text-center mb-4"><span id="scale5-value" class="text-2xl font-extrabold text-brand">' + escapeHtml(opt.label) + '</span></div>' +
          '<input type="range" id="scale5-slider" min="0" max="4" step="1" value="' + idx + '" class="w-full" style="accent-color:#E05C2A; height: 8px;" />' +
          '<div class="flex justify-between text-xs text-gray-400 mt-2 px-1"><span>Disagree</span><span>Agree</span></div>' +
          '<button type="button" id="scale5-next-btn" class="w-full bg-brand text-white font-bold py-4 rounded-xl hover:bg-brand-dark transition-colors text-lg shadow-sm mt-6">Next →</button>';
      } else {
        // 'choice' (unscored P3–P5, or scored TA)
        bodyHtml =
          '<div class="space-y-2.5" id="opts">' +
          q.options.map((opt, idx) => {
            const isSelected = saved && saved.index === idx;
            return '<button type="button" class="opt-btn' + (isSelected ? ' selected' : '') + '" data-idx="' + idx + '">' + escapeHtml(opt.label) + '</button>';
          }).join('') +
          '</div>';
      }

      const html = cardWrap(
        backButtonHtml(true) +
        progressHtml(stepNumber) +
        partDotsHtml(q.part) +
        '<p class="text-xs font-semibold text-brand uppercase tracking-widest mb-2">Part ' + q.part + ' of 3 · ' + q.partLabel + '</p>' +
        '<h2 class="text-xl sm:text-2xl font-bold text-gray-900 leading-snug mb-5">' + escapeHtml(q.text) + '</h2>' +
        bodyHtml
      );

      transitionTo(html, () => wireQuestionEvents(q));
    }

    function wireQuestionEvents(q) {
      const backBtn = document.getElementById('back-btn');
      if (backBtn) backBtn.addEventListener('click', goBack);

      if (q.type === 'text') {
        const input = document.getElementById('q-text-input');
        const nextBtn = document.getElementById('q-next-btn');
        input.addEventListener('input', () => {
          nextBtn.disabled = input.value.trim().length === 0;
        });
        document.getElementById('q-form').addEventListener('submit', e => {
          e.preventDefault();
          const val = input.value.trim();
          if (!val) return;
          state.answers[q.id] = { value: val };
          goNext();
        });
        input.focus();
        return;
      }

      if (q.type === 'scale10') {
        const slider = document.getElementById('scale-slider');
        const valueLabel = document.getElementById('scale-value');
        state.answers[q.id] = { value: parseInt(slider.value, 10) };
        slider.addEventListener('input', () => {
          const val = parseInt(slider.value, 10);
          state.answers[q.id] = { value: val };
          valueLabel.textContent = val;
        });
        document.getElementById('scale-next-btn').addEventListener('click', () => goNext());
        return;
      }

      if (q.type === 'scale5') {
        const slider = document.getElementById('scale5-slider');
        const valueLabel = document.getElementById('scale5-value');
        const setAnswerFromSlider = () => {
          const idx = parseInt(slider.value, 10);
          const opt = ASSESSMENT.scale5[idx];
          state.answers[q.id] = { index: idx, value: opt.value, label: opt.label };
          valueLabel.textContent = opt.label;
        };
        setAnswerFromSlider();
        slider.addEventListener('input', setAnswerFromSlider);
        document.getElementById('scale5-next-btn').addEventListener('click', () => goNext());
        return;
      }

      const optsContainer = document.getElementById('opts');
      const buttons = optsContainer.querySelectorAll('button');

      // 'choice'
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-idx'), 10);
          const opt = q.options[idx];
          buttons.forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          state.answers[q.id] = { index: idx, value: opt.value, label: opt.label };
          buttons.forEach(b => b.disabled = true);
          setTimeout(() => { buttons.forEach(b => b.disabled = false); goNext(); }, 250);
        });
      });
    }

    function renderName() {
      const html = cardWrap(
        backButtonHtml(true) +
        progressHtml(allQuestions.length + 1) +
        '<h2 class="text-xl sm:text-2xl font-bold text-gray-900 leading-snug mb-2">' + escapeHtml(ASSESSMENT.nameScreen.heading) + '</h2>' +
        '<p class="text-sm text-gray-500 mb-5">' + escapeHtml(ASSESSMENT.nameScreen.sub) + '</p>' +
        '<form id="name-form">' +
        '<input type="text" id="name-input" required placeholder="First name" value="' + escapeHtml(state.name) + '" class="qf-input w-full border-2 border-gray-200 rounded-xl px-5 py-4 text-lg font-medium text-gray-800 placeholder-gray-400 bg-gray-50 transition mb-4" />' +
        '<button type="submit" class="w-full bg-brand text-white font-bold py-4 rounded-xl hover:bg-brand-dark transition-colors text-lg shadow-sm">' + ASSESSMENT.nameScreen.button + '</button>' +
        '</form>'
      );
      transitionTo(html, () => {
        document.getElementById('back-btn').addEventListener('click', goBack);
        const input = document.getElementById('name-input');
        document.getElementById('name-form').addEventListener('submit', e => {
          e.preventDefault();
          const val = input.value.trim();
          if (!val) return;
          state.name = val;
          state.screen = 'results';
          render();
        });
        input.focus();
      });
    }

    function goNext() {
      if (state.qIndex < allQuestions.length - 1) {
        state.qIndex += 1;
        render();
      } else {
        state.screen = 'name';
        render();
      }
    }

    function goBack() {
      if (state.screen === 'name') {
        state.screen = 'question';
        state.qIndex = allQuestions.length - 1;
        render();
        return;
      }
      if (state.screen === 'question') {
        if (state.qIndex === 0) {
          state.screen = 'intro';
        } else {
          state.qIndex -= 1;
        }
        render();
      }
    }

    // ── Results screen ───────────────────────────────────────────────

    function barRow(label, score, band) {
      return '' +
        '<div class="mb-3">' +
        '<div class="flex items-center justify-between text-sm mb-1">' +
        '<span class="font-semibold text-gray-700">' + escapeHtml(label) + '</span>' +
        '<span class="font-bold" style="color:' + band.color + '">' + score + '/100 · ' + band.label + '</span>' +
        '</div>' +
        '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:' + score + '%;background:' + band.color + '"></div></div>' +
        '</div>';
    }

    function renderResults() {
      const r = computeResults(state.answers);
      const name = state.name;
      const role = state.answers['P4'] ? state.answers['P4'].label : '—';
      const level = state.answers['P5'] ? state.answers['P5'].label : '—';
      const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      const cats = ASSESSMENT.categories;

      let html = cardWrap(
        '<div class="text-center mb-6">' +
        '<p class="text-xs font-semibold text-brand uppercase tracking-widest mb-2">Your Results</p>' +
        '<h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 leading-tight">' + escapeHtml(name) + "'s Skill Assessment</h2>" +
        '<p class="text-sm text-gray-400 mt-1">' + escapeHtml(role) + ' · ' + escapeHtml(level) + ' · ' + today + '</p>' +
        '</div>' +

        '<div class="bg-brand-light border border-orange-100 rounded-2xl p-5 mb-6">' +
        '<p class="text-base text-gray-900 leading-relaxed">Your goal: <b>' + escapeHtml(r.goalHeadline.goal) + '</b>. You rated it <b>' + r.goalHeadline.importance + '/10</b>. You\'re meeting <b>' + r.goalHeadline.standardsMetCount + ' of ' + r.goalHeadline.totalStandards + '</b> training standards.</p>' +
        '<p class="text-base text-gray-900 leading-relaxed mt-2">' + escapeHtml(r.goalHeadline.line) + '</p>' +
        (r.goalHeadline.extra ? '<p class="text-base text-gray-900 leading-relaxed mt-2 font-semibold">' + escapeHtml(r.goalHeadline.extra) + '</p>' : '') +
        '</div>' +

        '<div class="text-center mb-7">' +
        '<p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-1">Overall Score</p>' +

        '<div class="mb-7">' +

        barRow(cats.athleticism.label, r.categoryScores.athleticism, bandFor(r.categoryScores.athleticism)) +
        barRow(cats.skill.label, r.categoryScores.skill, bandFor(r.categoryScores.skill)) +
        barRow(cats.gameiq.label, r.categoryScores.gameiq, bandFor(r.categoryScores.gameiq)) +

        barRow(cats.structure.label, r.categoryScores.structure, bandFor(r.categoryScores.structure)) +
        barRow(cats.feedback.label, r.categoryScores.feedback, bandFor(r.categoryScores.feedback)) +
        '</div>' +

        (r.flag ? '<div class="bg-[#1f223c] rounded-2xl p-5 mb-7"><p class="text-white font-semibold leading-relaxed">' + escapeHtml(r.flag.message) + '</p></div>' : '') +

        '<div class="mb-7">' +
        '<p class="text-sm font-bold text-gray-900 mb-3">Your top 3 gaps</p>' +
        r.topGaps.map(g =>
          '<div class="border border-gray-100 rounded-2xl p-4 mb-3">' +
          '<div class="flex items-center justify-between mb-1">' +
          '<p class="font-bold text-gray-900">' + escapeHtml(g.label) + '</p>' +
          '<p class="font-bold text-sm" style="color:' + g.band.color + '">' + g.score + '/100 · ' + g.band.label + '</p>' +
          '</div>' +
          '<p class="text-sm text-gray-500 leading-relaxed">' + escapeHtml(g.whatItLooksLike) + '</p>' +
          '</div>'
        ).join('') +
        '</div>' +

        '<div class="mb-7">' +
        '<p class="text-sm font-bold text-gray-900 mb-3">Training standards checklist</p>' +
        '<div class="space-y-1.5">' +
        r.standards.map(s =>
          '<div class="flex items-start gap-2 text-sm py-1.5 border-b border-gray-50">' +
          '<span class="font-bold flex-shrink-0" style="color:' + TIER_COLOR[s.tier] + '">' + TIER_ICON[s.tier] + '</span>' +
          '<span class="text-gray-700"><span class="font-medium">' + escapeHtml(s.label) + '</span> — You: ' + escapeHtml(s.userLabel) + '</span>' +
          '</div>'
        ).join('') +
        '</div>' +
        '<p class="text-sm text-gray-600 leading-relaxed mt-4">' + escapeHtml(r.standardsSummary) + '</p>' +
        '</div>' +

        '<div class="mb-7">' +
        '<p class="text-sm font-bold text-gray-900 mb-2">How to close your gaps</p>' +
        '<p class="text-sm text-gray-600 leading-relaxed mb-3">To reach your goal, you need two things – a structured, ultimate-specific plan that fits your life, and feedback on the specific parts of your game holding you back.</p>' +
        '<ul class="space-y-2">' +
        r.topGaps.map(g => '<li class="flex gap-2 text-sm text-gray-700"><span class="text-brand font-bold flex-shrink-0">•</span><span>' + escapeHtml(g.howToCloseIt) + '</span></li>').join('') +
        '</ul>' +
        '</div>' +

        '<button type="button" id="download-pdf-btn" class="w-full bg-white text-brand font-bold py-4 rounded-xl border-2 border-brand hover:bg-brand-light transition-colors text-base mb-5">DOWNLOAD MY REPORT (PDF)</button>' +

        fitCheckSectionHtml()
      );

      transitionTo(html, () => {
        document.getElementById('download-pdf-btn').addEventListener('click', () => downloadPdf(r, name, role, level, today));
        document.getElementById('open-fit-check-btn').addEventListener('click', revealFitCheck);
      });
    }

    // ════════════════════════════════════════════════════════════════
    // "See if you're a fit" — the embedded fit-check widget (see the
    // FIT_CHECK/fc* block below). Starts as just the dark CTA box; when
    // the athlete clicks "SEE IF YOU'RE A FIT", the box's contents are
    // replaced in place with #fit-check-app (no modal/popup — the
    // questionnaire takes over the exact spot the button was in).
    // ════════════════════════════════════════════════════════════════

    function fitCheckSectionHtml() {
      return '' +
        '<div id="fit-check-section" class="bg-[#1f223c] rounded-2xl p-6 text-center">' +
        '<p class="text-white text-base leading-relaxed mb-4">Based on what you\'ve shared, you could be a strong fit for one of our structured programs.</p>' +
        '<button type="button" id="open-fit-check-btn" class="block w-full bg-brand text-white font-extrabold px-6 py-4 rounded-xl border-2 border-brand hover:bg-white hover:text-brand transition-colors shadow-sm">SEE IF YOU\'RE A FIT →</button>' +
        '</div>';
    }

    function revealFitCheck() {
      const section = document.getElementById('fit-check-section');
      if (!section) return;
      section.outerHTML = '<div id="fit-check-app"></div>';
      fcInit();
    }

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzGiqtpyzwuGiSK6-sMj90KntvIhB-bPlCvk90JY0OSURcykjVaqBptHOul_pYzkz_T/exec';

    function submitApplicationData(data) {
      if (!APPS_SCRIPT_URL) return;
      const params = new URLSearchParams(data);
      fetch(APPS_SCRIPT_URL + '?' + params.toString(), { method: 'GET', mode: 'no-cors' }).catch(() => {});
    }

    // ════════════════════════════════════════════════════════════════
    // Embedded fit-check widget — ported from qualification/index.html
    // (same data/logic/copy; renamed with an "fc" prefix throughout to
    // avoid colliding with this page's own quiz, which already has a
    // `state`/`render`/`goBack`/etc. of its own). Mounts into
    // #fit-check-app, created above by revealFitCheck().
    // Submits to the SAME 'coaching_fit_lead'/'coaching_fit_application'
    // Apps Script types the standalone qualification page uses — no
    // backend changes needed, that handler already exists and is live.
    // ════════════════════════════════════════════════════════════════

    const FIT_CHECK = {
      contact: {
        heading: 'First, who are we talking to?',
        sub: "So we know who we're talking to.",
        button: 'Next →',
      },
      outcomeQualified: {
        heading: "Congrats - looks like you'd be a fit!",
        button: 'VIEW THE PROGRAM',
        url: 'https://www.skool.com/ultimate/about',
      },
      outcomeNotQualified: {
        heading: 'Not quite the right fit, right now.',
        sub: "That's okay — here's some free stuff to keep leveling up in the meantime:",
      },
      steps: [
        {
          id: 'playLocation', type: 'single', required: true,
          text: 'Which of the following best describes where you mostly play ultimate?',
          options: [
            { key: 'pickups', label: 'Pick ups' },
            { key: 'leagues', label: 'Leagues' },
            { key: 'club', label: 'Club trainings/tournaments' },
            { key: 'other', label: 'A combination' },
          ],
        },
        {
          id: 'struggles', type: 'multi', required: true,
          text: 'What are you struggling with most?',
          sub: 'Select all that apply.',
          options: [
            { key: 'gameiq', label: 'Game IQ (timing, spacing, reading the game, etc.)' },
            { key: 'skill', label: 'Skill Development (throwing, cutting technique, defensive footwork, etc.)' },
            { key: 'athleticism', label: 'Athleticism (speed/acceleration, vertical jump, ultimate-specific conditioning, etc.)' },
          ],
        },
        {
          id: 'gaps', type: 'multi', required: true,
          text: "And in your training, what's missing?",
          sub: 'Select all that apply.',
          options: [
            { key: 'structure', label: 'Having a structured, ultimate-specific plan' },
            { key: 'feedback', label: 'Getting regular feedback' },
            { key: 'accountability', label: 'Accountability' },
          ],
        },
        {
          id: 'primarySkill', type: 'single', required: true,
          text: "Which specific skill are you struggling with the most right now, that you'd like to solve first?",
          options: [
            { key: 'throwing', label: 'Throwing' },
            { key: 'defense', label: 'Defense' },
            { key: 'cutting', label: 'Cutting' },
            { key: 'catching', label: 'Catching' },
          ],
        },
        {
          id: 'scenario', type: 'single', required: true,
          text: 'Which of the scenarios below best describes your current situation outside of ultimate?',
          options: [
            { key: 'working', label: 'Primarily working' },
            { key: 'studying', label: 'Primarily studying' },
            { key: 'other', label: 'Something else' },
          ],
        },
        {
          id: 'budget', type: 'single', required: true,
          text: 'Our programs do involve a financial investment. Are you prepared to invest in your growth?',
          options: [
            { key: 'yes', label: "Yes, I'm ready to invest in my growth" },
            { key: 'no', label: 'No, not right now' },
          ],
        },
        {
          id: 'timeline', type: 'single', required: true,
          text: 'When are you ready to start?',
          options: [
            { key: 'immediate', label: 'Immediately, within the next 2 weeks' },
            { key: 'exploring', label: 'Within the next 60 days' },
            { key: 'no_timeline', label: 'No set timeline' },
          ],
        },
        {
          id: 'need', type: 'single', required: true,
          text: 'How important is it to solve this for your game in the next 90 days?',
          options: [
            { key: 'very_important', label: 'Very important' },
            { key: 'important', label: 'Important' },
            { key: 'somewhat_important', label: 'Somewhat important' },
            { key: 'not_important', label: 'Not important' },
          ],
        },
        {
          id: 'instagram', type: 'text', required: true,
          text: "Last thing — what's your Instagram handle?",
          sub: 'So we can reach you about your results and any questions.',
          placeholder: '@yourhandle',
        },
      ],
    };

    // Same rule as qualification/index.html — see that file's comment for
    // the full rationale (no budget = hard gate; otherwise the need level
    // must clear a bar that depends on scenario).
    const FC_NEED_LEVEL = { not_important: 0, somewhat_important: 1, important: 2, very_important: 3 };
    const FC_SCENARIO_NEED_THRESHOLD = { working: 1, studying: 2, other: 2 };

    function fcComputeQualified(answers) {
      if (answers.budget === 'no') {
        return { qualified: false, exitReason: 'budget' };
      }
      const needLevel = FC_NEED_LEVEL[answers.need];
      const threshold = FC_SCENARIO_NEED_THRESHOLD[answers.scenario];
      const needMet = (needLevel !== undefined ? needLevel : -1) >= threshold;
      return { qualified: needMet, exitReason: needMet ? '' : 'need' };
    }

    let fcState = {};
    function fcResetState() {
      fcState = { screen: 'contact', stepIndex: 0, answers: { struggles: [], gaps: [] }, firstName: '' };
    }

    // #fit-check-app doesn't exist in the DOM until revealFitCheck() swaps
    // it in (i.e. only once the athlete clicks the CTA button), so —
    // unlike this page's own #app — it's looked up fresh on every call
    // rather than cached in a module-level const.
    function fcTransitionTo(html, onReady) {
      const container = document.getElementById('fit-check-app');
      if (!container) return;
      const current = container.firstElementChild;
      if (!current) {
        container.innerHTML = html;
        if (onReady) onReady();
        return;
      }
      current.classList.add('qf-fade-out');
      setTimeout(() => {
        container.innerHTML = html;
        const next = container.firstElementChild;
        if (next) {
          next.classList.add('qf-fade-in');
          requestAnimationFrame(() => next.classList.add('qf-fade-in-active'));
          setTimeout(() => next.classList.remove('qf-fade-in', 'qf-fade-in-active'), 220);
        }
        if (onReady) onReady();
      }, 160);
    }

    function fcProgressHtml(stepNumber) {
      const totalSteps = FIT_CHECK.steps.length;
      const pct = Math.round((stepNumber / totalSteps) * 100);
      return '' +
        '<div class="flex justify-end mb-1.5"><span class="text-xs font-semibold text-gray-400">' + pct + '% complete</span></div>' +
        '<div class="progress-track mb-5"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    }

    function fcRender() {
      if (fcState.screen === 'contact') return fcRenderContact();
      if (fcState.screen === 'step') return fcRenderStep();
      if (fcState.screen === 'outcome') return fcRenderOutcome();
    }

    function fcRenderContact() {
      const html = cardWrap(
        backButtonHtml(false) + // nothing within this embedded widget to go back to
        fcProgressHtml(0) +
        '<h2 class="text-xl sm:text-2xl font-bold text-gray-900 leading-snug mb-2">' + escapeHtml(FIT_CHECK.contact.heading) + '</h2>' +
        '<p class="text-sm text-gray-500 mb-5">' + escapeHtml(FIT_CHECK.contact.sub) + '</p>' +
        '<form id="fc-contact-form" class="space-y-3" novalidate>' +
        '<input type="text" id="fc-first-name" required placeholder="First name" value="' + escapeHtml(fcState.firstName) + '" class="qf-input w-full border-2 border-gray-200 rounded-xl px-5 py-4 text-lg font-medium text-gray-800 placeholder-gray-400 bg-gray-50 transition" />' +
        '<button type="submit" class="w-full bg-brand text-white font-bold py-4 rounded-xl hover:bg-brand-dark transition-colors text-lg shadow-sm mt-2">' + FIT_CHECK.contact.button + '</button>' +
        '</form>'
      );
      fcTransitionTo(html, () => {
        const firstInput = document.getElementById('fc-first-name');
        document.getElementById('fc-contact-form').addEventListener('submit', e => {
          e.preventDefault();
          if (!e.target.reportValidity()) return;
          fcState.firstName = firstInput.value.trim();

          // Instagram isn't known yet — it's now the last question, to
          // incentivize finishing the flow.
          submitApplicationData({
            type: 'coaching_fit_lead',
            timestamp: new Date().toISOString(),
            source: 'eric-deng-ultimate.com/skill-assessment-tool',
            firstName: fcState.firstName,
          });

          fcState.screen = 'step';
          fcState.stepIndex = 0;
          fcRender();
        });
        firstInput.focus();
      });
    }

    function fcRenderStep() {
      const step = FIT_CHECK.steps[fcState.stepIndex];
      const stepNumber = fcState.stepIndex + 1;
      const saved = fcState.answers[step.id];

      let bodyHtml = '';
      if (step.type === 'multi') {
        const selected = saved || [];
        bodyHtml =
          (step.sub ? '<p class="text-sm text-gray-400 mb-3">' + escapeHtml(step.sub) + '</p>' : '') +
          '<div class="space-y-2.5 mb-5" id="fc-opts">' +
          step.options.map(opt => {
            const isSelected = selected.indexOf(opt.key) !== -1;
            return '<button type="button" class="opt-btn-multi' + (isSelected ? ' selected' : '') + '" data-key="' + opt.key + '">' +
              '<span class="opt-check"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg></span>' +
              escapeHtml(opt.label) + '</button>';
          }).join('') +
          '</div>' +
          '<button type="button" id="fc-multi-next-btn" class="w-full bg-brand text-white font-bold py-4 rounded-xl hover:bg-brand-dark transition-colors text-lg shadow-sm disabled:opacity-40 disabled:cursor-not-allowed" ' + (selected.length > 0 ? '' : 'disabled') + '>Next →</button>';
      } else if (step.type === 'text') {
        const val = saved || '';
        bodyHtml =
          (step.sub ? '<p class="text-sm text-gray-400 mb-3">' + escapeHtml(step.sub) + '</p>' : '') +
          '<input type="text" id="fc-step-text" placeholder="' + escapeHtml(step.placeholder || '') + '" value="' + escapeHtml(val) + '" class="qf-input w-full border-2 border-gray-200 rounded-xl px-5 py-4 text-lg font-medium text-gray-800 placeholder-gray-400 bg-gray-50 transition mb-4" />' +
          '<button type="button" id="fc-text-next-btn" class="w-full bg-brand text-white font-bold py-4 rounded-xl hover:bg-brand-dark transition-colors text-lg shadow-sm disabled:opacity-40 disabled:cursor-not-allowed" ' + (val.trim() ? '' : 'disabled') + '>Next →</button>';
      } else {
        // 'single'
        bodyHtml =
          '<div class="space-y-2.5" id="fc-opts">' +
          step.options.map(opt => {
            const isSelected = saved === opt.key;
            return '<button type="button" class="opt-btn' + (isSelected ? ' selected' : '') + '" data-key="' + opt.key + '">' + escapeHtml(opt.label) + '</button>';
          }).join('') +
          '</div>';
      }

      const html = cardWrap(
        backButtonHtml(true) +
        fcProgressHtml(stepNumber) +
        '<h2 class="text-xl sm:text-2xl font-bold text-gray-900 leading-snug mb-5">' + escapeHtml(step.text) + '</h2>' +
        bodyHtml
      );

      fcTransitionTo(html, () => {
        document.getElementById('back-btn').addEventListener('click', fcGoBack);
        fcWireStepEvents(step);
      });
    }

    function fcWireStepEvents(step) {
      if (step.type === 'multi') {
        const optsContainer = document.getElementById('fc-opts');
        const buttons = optsContainer.querySelectorAll('button');
        const nextBtn = document.getElementById('fc-multi-next-btn');
        if (!fcState.answers[step.id]) fcState.answers[step.id] = [];
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-key');
            const arr = fcState.answers[step.id];
            const idx = arr.indexOf(key);
            if (idx === -1) arr.push(key); else arr.splice(idx, 1);
            btn.classList.toggle('selected');
            nextBtn.disabled = arr.length === 0;
          });
        });
        nextBtn.addEventListener('click', () => fcGoNextStep());
        return;
      }

      if (step.type === 'text') {
        const input = document.getElementById('fc-step-text');
        const nextBtn = document.getElementById('fc-text-next-btn');
        input.addEventListener('input', () => {
          fcState.answers[step.id] = input.value.trim();
          nextBtn.disabled = input.value.trim().length === 0;
        });
        nextBtn.addEventListener('click', () => fcGoNextStep());
        input.focus();
        return;
      }

      const optsContainer = document.getElementById('fc-opts');
      const buttons = optsContainer.querySelectorAll('button');

      // 'single'
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-key');
          buttons.forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          fcState.answers[step.id] = key;
          buttons.forEach(b => b.disabled = true);
          setTimeout(() => { buttons.forEach(b => b.disabled = false); fcGoNextStep(); }, 250);
        });
      });
    }

    function fcGoNextStep() {
      if (fcState.stepIndex < FIT_CHECK.steps.length - 1) {
        fcState.stepIndex += 1;
        fcRender();
      } else {
        fcFinishAndShowOutcome();
      }
    }

    function fcGoBack() {
      if (fcState.screen === 'step') {
        if (fcState.stepIndex === 0) {
          fcState.screen = 'contact';
        } else {
          fcState.stepIndex -= 1;
        }
        fcRender();
      }
    }

    // Looks up the full option label for a raw answer key (e.g. 'pickups'
    // → 'Pick ups'), so the Sheet/email get readable answers instead of
    // internal codes. Falls back to the raw key for step types with no
    // `options` (like the 'text' instagram step).
    function fcStepLabel(stepId, key) {
      const step = FIT_CHECK.steps.find(s => s.id === stepId);
      const opt = step && step.options && step.options.find(o => o.key === key);
      return opt ? opt.label : (key || '');
    }
    function fcStepLabels(stepId, keys) {
      return (keys || []).map(k => fcStepLabel(stepId, k)).join(', ');
    }

    function fcFinishAndShowOutcome() {
      const result = fcComputeQualified(fcState.answers);
      fcState.result = result;

      submitApplicationData({
        type: 'coaching_fit_application',
        timestamp: new Date().toISOString(),
        source: 'eric-deng-ultimate.com/skill-assessment-tool',
        firstName: fcState.firstName,
        instagram: fcState.answers.instagram,
        playLocation: fcStepLabel('playLocation', fcState.answers.playLocation),
        struggles: fcStepLabels('struggles', fcState.answers.struggles),
        gaps: fcStepLabels('gaps', fcState.answers.gaps),
        primarySkill: fcStepLabel('primarySkill', fcState.answers.primarySkill),
        scenario: fcStepLabel('scenario', fcState.answers.scenario),
        budget: fcStepLabel('budget', fcState.answers.budget),
        timeline: fcStepLabel('timeline', fcState.answers.timeline),
        need: fcStepLabel('need', fcState.answers.need),
        qualified: String(result.qualified),
        exitReason: result.exitReason,
      });

      gtag('event', result.qualified ? 'coaching_fit_qualified' : 'coaching_fit_not_qualified', {
        event_category: 'qualification',
        reason: result.exitReason
      });

      fcState.screen = 'outcome';
      fcRender();
    }

    const FC_GAP_PHRASE = {
      structure: 'a structured, ultimate-specific plan',
      feedback: 'regular feedback',
      accountability: 'accountability',
    };
    const FC_SKILL_PHRASE = { throwing: 'throwing', defense: 'defense', cutting: 'cutting', catching: 'catching' };

    // "X, Y and Z" — used to personalise the qualified outcome from
    // whatever combination of gaps they actually picked.
    function fcJoinList(items) {
      if (items.length === 0) return '';
      if (items.length === 1) return items[0];
      if (items.length === 2) return items[0] + ' and ' + items[1];
      return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
    }

    function fcBuildQualifiedMessage() {
      const gapsList = fcJoinList((fcState.answers.gaps || []).map(k => FC_GAP_PHRASE[k]).filter(Boolean));
      const skillPhrase = FC_SKILL_PHRASE[fcState.answers.primarySkill] || '';

      return {
        diagnosis: "You said you currently don't have " + gapsList + ", and that you're mostly struggling with your " + skillPhrase + " right now.",
        fitStatement: "Based on your answers, it looks like we'd be able to help.",
        process: "We'll kick off with a 1:1 strategy call and actually talk through these roadblocks in your game right now, then build a custom plan - around your schedule - to solve your biggest problem inside your first 30 days.",
        support: "You'll also get my direct feedback and support every step of the way, so your gains actually show up in your game and you start seeing results.",
        personalNote: "It'd be cool to work with you, so please view the program details below, and you can join us using that link if this looks like the right next move for you and your goals.",
      };
    }

    function fcRenderOutcome() {
      const qualified = fcState.result && fcState.result.qualified;
      let html;
      if (qualified) {
        const o = FIT_CHECK.outcomeQualified;
        const msg = fcBuildQualifiedMessage();
        html = cardWrap(
          '<div class="text-center">' +
          '<div class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-5">' +
          '<svg class="w-7 h-7 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>' +
          '</div>' +
          '<p class="text-2xl font-extrabold text-gray-900 mb-5">' + escapeHtml(o.heading) + '</p>' +
          '<div class="text-left max-w-sm mx-auto">' +
          '<p class="text-base text-gray-900 leading-relaxed mb-4">' + escapeHtml(msg.diagnosis) + '</p>' +
          '<p class="text-base text-gray-900 leading-relaxed mb-6">' + escapeHtml(msg.fitStatement) + '</p>' +
          '<p class="text-xs font-semibold text-brand uppercase tracking-widest mb-2">What it looks like to start</p>' +
          '<p class="text-base text-gray-900 leading-relaxed mb-4">' + escapeHtml(msg.process) + '</p>' +
          '<p class="text-base text-gray-900 leading-relaxed mb-6">' + escapeHtml(msg.support) + '</p>' +
          '<p class="text-base text-gray-900 leading-relaxed mb-6">' + escapeHtml(msg.personalNote) + '</p>' +
          '<p class="text-base text-gray-900 italic">-Eric</p>' +
          '</div>' +

    // Entry point, called from renderResults()'s onReady — reset-and-render
    // every time the results screen shows, so a retake starts this fresh too.
    function fcInit() {
      fcResetState();
      fcRender();
