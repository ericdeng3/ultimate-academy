    // ════════════════════════════════════════════════════════════════
    // PDF report (jsPDF) — drawn with text/rect primitives, not a
    // screenshot, so it stays sharp and the apply link stays clickable.
    // ════════════════════════════════════════════════════════════════

    function hexToRgb(hex) {
      const n = parseInt(hex.replace('#', ''), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    // jsPDF's standard fonts (helvetica/times/courier) only support the
    // WinAnsi/Latin-1 glyph set. r.goalHeadline.goal is free text the
    // athlete typed themselves (Q1) — if it contains an emoji or a
    // character outside that range, handing it straight to jsPDF can
    // break the render, so strip anything outside printable ASCII/Latin-1
    // before it reaches the PDF (the on-screen HTML version is untouched —
    // the browser renders full Unicode fine, this is a PDF-only concern).
    function pdfSafeText(str) {
      return String(str).replace(/[^\x20-\xFF]/g, '');
    }

    function downloadPdf(r, name, role, level, today) {
      if (!window.jspdf) {
        alert('The PDF library is still loading — please wait a moment and try again.');
        return;
      }
      try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const marginX = 48;
      const contentW = pageW - marginX * 2;
      const brandRgb = hexToRgb('#E05C2A');
      const darkRgb = hexToRgb('#1f223c');
      let y = 50;

      function text(str, x, yPos, opts) {
        opts = opts || {};
        doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
        doc.setFontSize(opts.size || 10);
        if (opts.color) doc.setTextColor(opts.color[0], opts.color[1], opts.color[2]);
        else doc.setTextColor(31, 41, 55);
        doc.text(str, x, yPos);
      }

      function wrapped(str, x, yPos, size, lineHeight, maxWidth) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(size);
        doc.setTextColor(55, 65, 81);
        const lines = doc.splitTextToSize(str, maxWidth || contentW);
        lines.forEach((line, i) => doc.text(line, x, yPos + i * lineHeight));
        return yPos + lines.length * lineHeight;
      }

      // ── Page 1 header ──
      doc.setFillColor(darkRgb[0], darkRgb[1], darkRgb[2]);
      doc.rect(0, 0, pageW, 70, 'F');
      text('ERIC DENG ULTIMATE · SKILL ASSESSMENT', marginX, 32, { size: 12, bold: true, color: [255, 255, 255] });
      text(name + "'s Report", marginX, 52, { size: 10, color: [230, 230, 230] });

      y = 100;
      text(name + '  ·  ' + role + '  ·  ' + level + '  ·  ' + today, marginX, y, { size: 9, color: [107, 114, 128] });
      y += 22;

      text('Your Goal', marginX, y, { size: 12, bold: true, color: brandRgb });
      y += 16;
      y = wrapped('Goal: ' + pdfSafeText(r.goalHeadline.goal) + '.  Rated ' + r.goalHeadline.importance + '/10 important.  Meeting ' + r.goalHeadline.standardsMetCount + ' of ' + r.goalHeadline.totalStandards + ' training standards.', marginX, y, 10, 13);
      y += 4;
      y = wrapped(r.goalHeadline.line, marginX, y, 10, 13);
      if (r.goalHeadline.extra) { y = wrapped(r.goalHeadline.extra, marginX, y, 10, 13); }
      y += 16;

      // Overall score
      const overallBand = bandFor(r.overall);
      text('Overall Score', marginX, y, { size: 12, bold: true, color: brandRgb });
      const obRgb = hexToRgb(overallBand.color);
      text(r.overall + '/100  ·  ' + overallBand.label, marginX + 120, y, { size: 12, bold: true, color: obRgb });
      y += 20;

      // Category bars
      function drawBarChart(groupLabel, keys) {
        text(groupLabel, marginX, y, { size: 10, bold: true, color: [31, 41, 55] });
        y += 12;
        keys.forEach(key => {
          const score = r.categoryScores[key];
          const band = bandFor(score);
          const rgb = hexToRgb(band.color);
          text(ASSESSMENT.categories[key].label, marginX, y, { size: 9 });
          text(score + '/100 · ' + band.label, pageW - marginX - 90, y, { size: 9, bold: true, color: rgb });
          y += 4;
          doc.setFillColor(229, 231, 235);
          doc.roundedRect(marginX, y, contentW, 7, 3, 3, 'F');
          doc.setFillColor(rgb[0], rgb[1], rgb[2]);
          doc.roundedRect(marginX, y, Math.max(contentW * (score / 100), 7), 7, 3, 3, 'F');
          y += 16;
        });
        y += 6;
      }
      drawBarChart('Your game', ['athleticism', 'skill', 'gameiq']);
      drawBarChart('Your training', ['structure', 'feedback']);

      // Translation flag
      if (r.flag) {
        // splitTextToSize measures using the CURRENTLY active font — it must
        // be set to the same font/size used to actually draw the text below,
        // or the wrap width is computed against the wrong character widths
        // and lines can render wider than the box they're measured for.
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        const flagLines = doc.splitTextToSize(r.flag.message, contentW - 20);
        const boxH = flagLines.length * 13 + 16;
        doc.setFillColor(darkRgb[0], darkRgb[1], darkRgb[2]);
        doc.roundedRect(marginX, y, contentW, boxH, 6, 6, 'F');
        doc.setTextColor(255, 255, 255);
        flagLines.forEach((line, i) => doc.text(line, marginX + 10, y + 18 + i * 13));
        y += boxH + 16;
      }

      // Top 3 gaps
      text('Your Top 3 Gaps', marginX, y, { size: 12, bold: true, color: brandRgb });
      y += 16;
      r.topGaps.forEach(g => {
        const rgb = hexToRgb(g.band.color);
        text(g.label + '  —  ' + g.score + '/100 · ' + g.band.label, marginX, y, { size: 10, bold: true, color: rgb });
        y += 13;
        y = wrapped(g.whatItLooksLike, marginX, y, 9, 12);
        y += 8;
      });

      // ── Page 2 ──
      doc.addPage();
      y = 50;
      text('Training Standards Checklist', marginX, y, { size: 13, bold: true, color: brandRgb });
      y += 18;
      const TIER_RGB = { green: [22, 163, 74], yellow: [217, 119, 6], red: [220, 38, 38] };
      const statusColW = 65; // wide enough for "Developing", the longest status word
      r.standards.forEach(s => {
        text(TIER_LABEL[s.tier], marginX, y, { size: 9, bold: true, color: TIER_RGB[s.tier] });
        const lines = doc.splitTextToSize(s.label + ' — You: ' + s.userLabel, contentW - statusColW);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(55, 65, 81);
        lines.forEach((line, i) => doc.text(line, marginX + statusColW, y + i * 11));
        y += Math.max(11 * lines.length, 11) + 5;
      });

      y += 10;
      y = wrapped(r.standardsSummary, marginX, y, 9.5, 12);
      y += 14;
      text('How To Close Your Gaps', marginX, y, { size: 13, bold: true, color: brandRgb });
      y += 16;
      y = wrapped('To reach your goal, you need two things – a structured, ultimate-specific plan that fits your life, and feedback on the specific parts of your game holding you back.', marginX, y, 10, 13);
      y += 6;
      r.topGaps.forEach(g => {
        y = wrapped('•  ' + g.howToCloseIt, marginX, y, 9.5, 12);
        y += 4;
      });

      y += 10;
      const ctaMsg = "If you'd like our help closing these gaps, apply below. Based on what you've shared, you could be a strong fit for one of our structured programs.";
      // Same rule as the flag box above: measure with the font that will
      // actually render the text, not whatever was last active (here, the
      // 9.5pt from the gap bullets just above).
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      const ctaLines = doc.splitTextToSize(ctaMsg, contentW - 20);
      const ctaBoxH = ctaLines.length * 13 + 50;
      doc.setFillColor(darkRgb[0], darkRgb[1], darkRgb[2]);
      doc.roundedRect(marginX, y, contentW, ctaBoxH, 6, 6, 'F');
      doc.setTextColor(255, 255, 255);
      ctaLines.forEach((line, i) => doc.text(line, marginX + 10, y + 18 + i * 13));
      const linkY = y + ctaLines.length * 13 + 32;
      const linkLabel = 'Learn more and apply ->';
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      const linkW = doc.getTextWidth(linkLabel) + 24; // sized to the actual text, not a guessed constant
      doc.setFillColor(brandRgb[0], brandRgb[1], brandRgb[2]);
      doc.roundedRect(marginX + 10, linkY - 14, linkW, 22, 5, 5, 'F');
      doc.setTextColor(255, 255, 255);
      doc.textWithLink(linkLabel, marginX + 22, linkY, { url: 'https://eric-deng-ultimate.com/qualification/' });

      // Footer on both pages
      const footerText = 'eric-deng-ultimate.com · © 2026 Eric Deng Ultimate';
      [1, 2].forEach(p => {
        doc.setPage(p);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(156, 163, 175);
        doc.text(footerText, marginX, pageH - 24);
      });

      const safeName = (name || 'Athlete').replace(/[^a-z0-9]+/gi, '-').replace(/(^-|-$)/g, '');
      doc.save(safeName + '-Skill-Assessment.pdf');
      } catch (err) {
        console.error('PDF generation failed:', err);
        alert('Something went wrong generating the PDF. Please try again — if it keeps happening, let us know.');
      }
    }

    // ════════════════════════════════════════════════════════════════
    // Self-tests — run `runSelfTests()` in the browser console.
    // Covers all-lowest, all-highest, and a hand-calculated mixed case.
    // ════════════════════════════════════════════════════════════════

    function buildAnswers(part2Idx, part3Idx, extra) {
      const answers = {};
      ASSESSMENT.part2.forEach(q => {
        const idx = part2Idx(q);
        const opt = q.options[idx];
        answers[q.id] = { index: idx, value: opt.value, label: opt.label };
      });
      ASSESSMENT.part3.forEach(q => {
        const idx = part3Idx(q);
        const opt = ASSESSMENT.scale5[idx];
        answers[q.id] = { index: idx, value: opt.value, label: opt.label };
      });
      Object.assign(answers, extra);
      return answers;
    }

    // Hand-built "realistic" answer set, shared by the self-tests and the
    // ?preview= dev shortcut below — see runSelfTests' "mixed" case for the
    // worked-out expected scores this produces.
    const PREVIEW_MIXED_TA_IDX = {
      PF: 2, TA1: 1, TA2: 3, TA3: 1, TA4: 3, TA5: 3, TA6: 3, TA7: 0, TA7Structure: 0, TA8: 0, TA8Structure: 0,
      TA9: 2, TA10: 1, TA11: 1, TA12: 1, TA13: 1,
    };
    const PREVIEW_MIXED_YG_IDX = {
      YG1: 4, YG2: 4, YG3: 4, YG4: 4,
      YG5: 0, YG6: 0, YG7: 0, YG8: 0,
      YG9: 2, YG10: 2, YG11: 2, YG12: 2,
      YG13: 1,
    };

    // Jump straight to the results screen with canned answers — for dev
    // testing only, so you don't have to click through all 32 questions
    // every time you want to check the results/PDF layout. Load the page
    // with ?preview=mixed (or low / high) to use it; see README note below
    // render() at the bottom of this file for the full instructions.
    function buildPreviewAnswers(kind) {
      const common = {
        P4: { index: 0, value: 'handler', label: 'Handler' },
        P5: { index: 1, value: 'leagues', label: 'Leagues' },
      };
      if (kind === 'low') {
        return buildAnswers(() => 0, () => 0, Object.assign({
          P1: { value: 'Make my club team' }, P2: { value: 7 },
          P3: { index: 0, value: 'lt3', label: 'Within 3 months' },
        }, common));
      }
      if (kind === 'high') {
        return buildAnswers(q => q.options.length - 1, () => 4, Object.assign({
          P1: { value: 'Make nationals' }, P2: { value: 10 },
          P3: { index: 3, value: 'none', label: 'No set date' },
        }, common));
      }
      // 'mixed' (default)
      return buildAnswers(q => PREVIEW_MIXED_TA_IDX[q.id], q => PREVIEW_MIXED_YG_IDX[q.id], Object.assign({
        P1: { value: 'Make NSW State Team' }, P2: { value: 9 },
        P3: { index: 0, value: 'lt3', label: 'Within 3 months' },
      }, common));
    }

    function runSelfTests() {
      let pass = 0, fail = 0;
      function check(label, actual, expected) {
        const ok = JSON.stringify(actual) === JSON.stringify(expected);
        console.log((ok ? '✓ PASS' : '✗ FAIL') + ' — ' + label, ok ? '' : { actual, expected });
        ok ? pass++ : fail++;
      }

      // Case 1: all-lowest
      const lowest = buildAnswers(() => 0, () => 0, {
        P1: { value: 'Test goal' }, P2: { value: 1 }, P3: { index: 0, value: 'lt3', label: 'Within 3 months' },
      });
      const rLow = computeResults(lowest);
      check('all-lowest category scores', rLow.categoryScores, { athleticism: 0, skill: 0, gameiq: 0, structure: 0, feedback: 0 });
      check('all-lowest overall', rLow.overall, 0);
      check('all-lowest standardsMet', rLow.standardsMetCount, 0);
      check('all-lowest flag', rLow.flag, null);
      check('all-lowest topGaps order (athleticism forced #1 — no program at all)', rLow.topGaps.map(g => g.key), ['athleticism', 'structure', 'feedback']);

      // Case 2: all-highest
      const highest = buildAnswers(q => q.options.length - 1, () => 4, {
        P1: { value: 'Test goal' }, P2: { value: 10 }, P3: { index: 3, value: 'none', label: 'No set date' },
      });
      const rHigh = computeResults(highest);
      check('all-highest category scores', rHigh.categoryScores, { athleticism: 100, skill: 100, gameiq: 100, structure: 100, feedback: 100 });
      check('all-highest overall', rHigh.overall, 100);
      check('all-highest standardsMet', rHigh.standardsMetCount, 12);
      check('all-highest flag', rHigh.flag, null);
      check('all-highest topGaps order', rHigh.topGaps.map(g => g.key), ['structure', 'feedback', 'gameiq']);

      // Case 3: hand-calculated mixed case (see brief/code comments for the
      // worked-out math) — high session frequency but ad-hoc strength
      // training (TA1 not the top answer), weak skill/game-IQ work, and low
      // reported training gains. Lands standardsMet in the 0–4 bracket with
      // the <3-month extra line. Because TA1 isn't the top answer,
      // athleticism is capped at 69 (Developing) rather than reaching 70+,
      // which means this profile trips the "working hard, little to show"
      // flag rather than "fit but not showing it" — physical base ahead of
      // the game requires an actual program behind it, not just frequency.
      const mixed = buildAnswers(q => PREVIEW_MIXED_TA_IDX[q.id], q => PREVIEW_MIXED_YG_IDX[q.id], {
        P1: { value: 'Make NSW State Team' }, P2: { value: 9 }, P3: { index: 0, value: 'lt3', label: 'Within 3 months' },
      });
      const rMixed = computeResults(mixed);
      check('mixed category scores', rMixed.categoryScores, { athleticism: 69, skill: 0, gameiq: 50, structure: 31, feedback: 25 });
      check('mixed overall', rMixed.overall, 35);
      check('mixed athleticism capped at Developing, not Solid/Strength (no ultimate-specific program)', bandFor(rMixed.categoryScores.athleticism).key, 'developing');
      check('mixed standardsMet', rMixed.standardsMetCount, 4);
      check('mixed flag', rMixed.flag && rMixed.flag.key, 'workingHard');
      check('mixed topGaps order (athleticism forced #1 — ad-hoc strength training)', rMixed.topGaps.map(g => g.key), ['athleticism', 'skill', 'feedback']);
      check('mixed goal headline bracket', rMixed.goalHeadline.line, "Your training isn't set up for this goal yet. The gaps below are why it feels further away than it should.");
      check('mixed <3mo extra line', rMixed.goalHeadline.extra, "With under 3 months to go, which gaps you close first matters.");

      // Case 4: a minimal answer set built specifically to trigger the
      // *other* flag ("working hard, little to show") — low athleticism so
      // flag A can't fire, trains 8 sessions/week by the estimate formula,
      // but YG13 ("I can see my gains in games") is "Disagree".
      const flagBAnswers = {
        TA2: { index: 3, value: 4 },
        TA4: { index: 2, value: 2 }, TA5: { index: 2, value: 2 },
        TA6: { index: 2, value: 2 }, TA7: { index: 2, value: 2 }, TA8: { index: 2, value: 2 },
        YG13: { index: 1, value: 1 },
      };
      const sessionEst = computeSessionEstimate(flagBAnswers);
      check('flagB session estimate', sessionEst, 8);
      const flagBScores = computeCategoryScores(flagBAnswers);
      check('flagB athleticism below 70 (so flag A cannot fire)', flagBScores.athleticism < 70, true);
      const flagBResult = computeFlag(flagBScores, flagBAnswers, sessionEst);
      check('flagB key', flagBResult && flagBResult.key, 'workingHard');

      // Case 5: TA4/TA6 standards personalised to playing frequency (PF).
      // At 2x/week playing, target drops to 1x/week for both — "Once a
      // week" should now satisfy both, which it would NOT have under the
      // old flat "twice a week" rule.
      const standardsAtPf2 = computeStandards({
        PF: { index: 2, value: 2 },
        TA4: { index: 2, value: 2, label: 'Once a week' },
        TA6: { index: 2, value: 2, label: 'Once a week' },
      });
      check('TA4 met at 2x/week playing + "Once a week" answer', standardsAtPf2.find(s => s.id === 'TA4').met, true);
      check('TA6 met at 2x/week playing + "Once a week" answer', standardsAtPf2.find(s => s.id === 'TA6').met, true);

      // At 3+/week playing: accel/COD target drops to 0 (games cover it —
      // "Rarely or never" still passes), but top-speed target floors at 1
      // (never fully replaced by playing more) — "Rarely or never" fails.
      const standardsAtPf3 = computeStandards({
        PF: { index: 3, value: 3 },
        TA4: { index: 0, value: 0, label: 'Rarely or never' },
        TA6: { index: 0, value: 0, label: 'Rarely or never' },
      });
      check('TA4 NOT met at 3+/week playing + "Rarely or never" (top-speed floor)', standardsAtPf3.find(s => s.id === 'TA4').met, false);
      check('TA6 met at 3+/week playing + "Rarely or never" (accel/COD can hit 0)', standardsAtPf3.find(s => s.id === 'TA6').met, true);

      // PF itself must never show up as a 14th "standard".
      check('PF excluded from standards checklist (and TA11, folded into TA10)', computeStandards({}).length, 12);

      // Case 6: the new yellow ("developing") tier — one step below the
      // standard should be yellow, not lumped in with red.
      const tierCheck = computeStandards({
        PF: { index: 1, value: 1 }, // target for TA4 is 2x/week here
        TA1: { index: 2, value: 2, label: 'A general gym program' }, // static: minMetIndex 3, one below = yellow
        TA4: { index: 2, value: 2, label: 'Once a week' }, // dynamic: target 2 → minMetIndex 3, one below = yellow
        TA6: { index: 0, value: 0, label: 'Rarely or never' }, // target = max(0,3-1)=2 → minMetIndex 3, two below = red
      });
      check('TA1 tier yellow (one step below static standard)', tierCheck.find(s => s.id === 'TA1').tier, 'yellow');
      check('TA4 tier yellow (one step below personalised standard)', tierCheck.find(s => s.id === 'TA4').tier, 'yellow');
      check('TA6 tier red (two steps below personalised standard)', tierCheck.find(s => s.id === 'TA6').tier, 'red');
      check('Yellow does not count toward standardsMetCount', tierCheck.find(s => s.id === 'TA1').met, false);

      // computeStandardsSummary: a red-heavy answer set should name the
      // red standards; an all-green set should say so instead.
      const summaryWithReds = computeStandardsSummary(tierCheck);
      check('standards summary mentions a red item when reds exist', summaryWithReds.indexOf('biggest gaps') !== -1, true);
      const summaryAllGreen = computeStandardsSummary(rHigh.standards);
      check('standards summary is the all-green message when nothing is red/yellow', summaryAllGreen.indexOf('meeting every training standard') !== -1, true);

      // Case 6b: TA7/TA8's two-axis (frequency + structure) tier — split
      // into two questions, so this proves the combination logic directly.
      check('weekly + structured → green',
        computeStructuredPracticeTier({ index: 2 }, { index: 1 }), 'green');
      check('weekly + self-directed → yellow (regular but no real plan)',
        computeStructuredPracticeTier({ index: 3 }, { index: 0 }), 'yellow');
      check('fortnightly + structured → yellow (real plan, not often enough yet)',
        computeStructuredPracticeTier({ index: 1 }, { index: 1 }), 'yellow');
      check('rarely + self-directed → red',
        computeStructuredPracticeTier({ index: 0 }, { index: 0 }), 'red');
      check('missing either answer → red',
        computeStructuredPracticeTier({ index: 3 }, null), 'red');
      const splitCheck = computeStandards({
        TA7: { index: 2, value: 2, label: 'Once a week' },
        TA7Structure: { index: 1, value: 1, label: 'Structured — specific drills or a coached plan' },
        TA8: { index: 3, value: 4, label: 'Twice a week or more' },
        TA8Structure: { index: 0, value: 0, label: 'Self-directed — I come up with it myself' },
      });
      check('TA7 (weekly + structured) comes out green via the real checklist path',
        splitCheck.find(s => s.id === 'TA7').tier, 'green');
      check('TA8 (2x/week but self-directed) comes out yellow via the real checklist path',
        splitCheck.find(s => s.id === 'TA8').tier, 'yellow');
      check('TA7Structure itself never appears as its own standard',
        splitCheck.some(s => s.id === 'TA7Structure'), false);

      // Case 7: Athleticism Strength-band cap — maxed-out session frequency
      // should NOT be enough on its own if TA1 isn't the top (ultimate-
      // specific program) answer, even though every other athleticism item
      // is at its max.
      const maxFreqNoProgram = buildAnswers(
        q => (q.id === 'TA1' ? 1 : q.options.length - 1), // everything maxed except TA1
        () => 4,
        { P1: { value: 'Test' }, P2: { value: 10 }, P3: { index: 3, value: 'none', label: 'No set date' } }
      );
      const cappedResult = computeResults(maxFreqNoProgram);
      check('athleticism capped at 69 (Developing, not Solid) without an ultimate-specific program, even at max frequency', cappedResult.categoryScores.athleticism, 69);
      const maxFreqWithProgram = buildAnswers(q => q.options.length - 1, () => 4, {
        P1: { value: 'Test' }, P2: { value: 10 }, P3: { index: 3, value: 'none', label: 'No set date' },
      });
      check('athleticism reaches 100 when max frequency IS paired with an ultimate-specific program', computeResults(maxFreqWithProgram).categoryScores.athleticism, 100);

      // Case 8: embedded fit-check widget's qualification rule (ported from
      // qualification/index.html — see FC_SCENARIO_NEED_THRESHOLD above).
      check('fit-check: no budget + working + need very_important → still disqualified (hard gate)',
        fcComputeQualified({ budget: 'no', scenario: 'working', need: 'very_important' }).qualified, false);
      check('fit-check: working + budget + need somewhat_important → qualified (meets working threshold exactly)',
        fcComputeQualified({ budget: 'yes', scenario: 'working', need: 'somewhat_important' }).qualified, true);
      check('fit-check: working + budget + need not_important → disqualified (one below working threshold)',
        fcComputeQualified({ budget: 'yes', scenario: 'working', need: 'not_important' }).qualified, false);
      check('fit-check: studying + budget + need important → qualified (meets studying threshold exactly)',
        fcComputeQualified({ budget: 'yes', scenario: 'studying', need: 'important' }).qualified, true);
      check('fit-check: studying + budget + need somewhat_important → disqualified',
        fcComputeQualified({ budget: 'yes', scenario: 'studying', need: 'somewhat_important' }).qualified, false);
      check('fit-check: "something else" + budget + need important → qualified (defaulted to studying-level bar)',
        fcComputeQualified({ budget: 'yes', scenario: 'other', need: 'important' }).qualified, true);
      check('fit-check: exitReason "budget" when budget is the disqualifier',
        fcComputeQualified({ budget: 'no', scenario: 'working', need: 'very_important' }).exitReason, 'budget');
      check('fit-check: exitReason "need" when the scenario threshold isn\'t met',
        fcComputeQualified({ budget: 'yes', scenario: 'studying', need: 'not_important' }).exitReason, 'need');

      console.log(pass + ' passed, ' + fail + ' failed.');
      return { pass, fail };
    }
    window.runSelfTests = runSelfTests;

    // ── Dev shortcut: jump straight to results ─────────────────────
    // Load this page with ?preview=mixed (or ?preview=low / ?preview=high)
    // to skip the whole 32-question flow and land straight on the results
    // screen with realistic canned answers — for checking results/PDF
    // layout changes without re-answering everything each time. Has no
    // effect without the query param; remove the param (or just reload
    // without it) to go through the quiz normally.
    const previewKind = new URLSearchParams(location.search).get('preview');
    if (previewKind) {
      state.answers = buildPreviewAnswers(previewKind);
      state.name = 'Preview';
      state.screen = 'results';
    }

    // Top-bar badge restarts the quiz from the intro screen rather than
    // navigating to the site homepage — same pattern as qualification/index.html.
    document.getElementById('top-bar-restart').addEventListener('click', e => {
      e.preventDefault();
      resetState();
      render();
    });

    render();
  </script>
</body>
</html>
